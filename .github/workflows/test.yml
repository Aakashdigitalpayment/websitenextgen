name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: coop
          POSTGRES_PASSWORD: coop
          POSTGRES_DB: coop
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U coop" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://coop:coop@localhost:5432/coop
      SESSION_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --omit=optional
      - name: Schema converter output is up to date
        run: node scripts/convert-mysql-schema.js db/legacy/install.sql | diff -q - db/schema.sql
      - run: npm run db:migrate
      - run: npm test
