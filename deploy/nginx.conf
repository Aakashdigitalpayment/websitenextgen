# Alternative to Caddy: Nginx in front of the app.
# Nginx cannot issue certificates on demand, so use a wildcard certificate for
# *.coopcloud.com.np (certbot with a DNS plugin) and add a server block per custom domain.
#   certbot certonly --dns-cloudflare -d coopcloud.com.np -d '*.coopcloud.com.np'

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    listen [::]:80;
    server_name coopcloud.com.np *.coopcloud.com.np;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name coopcloud.com.np *.coopcloud.com.np;

    ssl_certificate     /etc/letsencrypt/live/coopcloud.com.np/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coopcloud.com.np/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 25m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }
    # the TLS ask hook is for the local proxy only
    location = /__tls/allowed { return 404; }
}

